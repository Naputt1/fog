[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "Zlib",
    "0BSD",
    "OpenSSL",
]

[advisories]
# Advisory config schema v2. cargo-deny 0.20 only implements v2 (the key is a
# no-op there and no longer emitted by `cargo-deny init`); kept because older
# cargo-deny releases still use it to select v2 semantics.
version = 2

[bans]
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
