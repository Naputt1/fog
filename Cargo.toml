[package]
name = "fog-tui"
version = "0.1.3"
description = "Terminal-based service orchestrator & reverse-proxy dashboard"
repository = "https://github.com/Naputt1/fog"
license = "MIT"
keywords = ["tui", "proxy", "orchestrator", "terminal", "ratatui"]
categories = ["command-line-utilities", "development-tools"]
edition = "2024"
include = ["src/**/*", "build.rs", "build/**/*", "spa.lock", "ui/dist/**/*", "README.md", "LICENSE", "fog.schema.json", "fog.json"]
readme = "README.md"

[lib]
name = "fog"
path = "src/lib.rs"

[[bin]]
name = "fog"
path = "src/main.rs"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
reqwest = { version = "0.13", features = ["blocking"] }

[[bench]]
name = "terminal_bench"
harness = false

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = {version = "1.0.228", features = ["derive"]}
serde_json = "1"
clap = { version = "4", features = ["derive"] }
portable-pty = "0.9"
base64 = "0.23"
ctrlc = { version = "3.4", features = ["termination"] }
vt100 = "0.18"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "client-legacy"] }
http-body-util = "0.1"
http-body = "1"
futures-core = "0.3"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time", "process", "sync"] }
url = "2"
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
notify = "8"
tokio-tungstenite = "0.30"
futures-channel = "0.3"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"

[build-dependencies]
brotli = "9.0.0"
flate2 = "1.1.10"
# Verifies the pinned SPA tarball against spa.lock before anything is extracted.
sha2 = "0.10"

[lints.clippy]
# Production code never unwraps: a panic in the TUI thread takes every service
# the instance owns down with it, and one in the proxy thread silently drops
# the listener. Tests are exempt via `clippy.toml` (`allow-unwrap-in-tests`).
unwrap_used = "warn"
# `correctness` findings are real bugs by definition, so they fail the build
# instead of scrolling past in a warning list. The lower priority is required
# because a group and a single lint cannot share one.
correctness = { level = "deny", priority = -1 }
