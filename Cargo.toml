[package]
name = "fog"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
reqwest = { version = "0.12", features = ["blocking"] }

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = {version = "1.0.228", features = ["derive"]}
serde_json = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
portable-pty = "0.8"
base64 = "0.22"
ctrlc = "3.4"
vt100 = "0.16"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "client-legacy"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time"] }
url = "2"
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
notify = "8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
