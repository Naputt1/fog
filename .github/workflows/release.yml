name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install frontend deps
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Build frontend (SPA -> ui/dist)
        working-directory: ui
        run: pnpm build
      - name: Verify SPA bundle exists
        run: |
          ls -la ui/dist
          test -f ui/dist/index.html || (echo "ui/dist/index.html missing" && exit 1)
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
      - name: Verify crate package includes SPA
        run: |
          cargo package --allow-dirty --list | grep -q "ui/dist/index.html" || (echo "ui/dist not included in package" && cargo package --allow-dirty --list && exit 1)
          cargo package --allow-dirty --list
      - name: Create SPA tarball for git installs
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          tar czf fog-spa-v${VERSION}.tar.gz -C ui dist
          tar czf fog-spa.tar.gz -C ui dist
          ls -lh fog-spa*.tar.gz
      - name: Publish to crates.io
        uses: katyo/publish-crates@v2
        with:
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          args: --allow-dirty
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fog-spa-*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
