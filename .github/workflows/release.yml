name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.1)"
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('ui/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install frontend deps
        working-directory: ui
        run: bun install --frozen-lockfile
      - name: Build frontend (SPA -> ui/dist)
        working-directory: ui
        run: bun run build
      - name: Verify SPA bundle exists
        run: |
          ls -la ui/dist
          test -f ui/dist/index.html || (echo "ui/dist/index.html missing" && exit 1)
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
      - name: Verify crate package includes SPA
        run: |
          cargo package --allow-dirty --list | grep -q "ui/dist/index.html" || (echo "ui/dist not included in package" && cargo package --allow-dirty --list && exit 1)
          cargo package --allow-dirty --list
      - name: Verify SPA is embedded (no fallback)
        run: |
          cargo clean
          FOG_REQUIRE_SPA=1 cargo build
          echo "SPA embedded correctly (FOG_REQUIRE_SPA=1 build succeeded)"
      - name: Create SPA tarball for git installs
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="$GITHUB_REF"; fi
          TAG=${TAG#refs/tags/}
          if [ "$TAG" = "$GITHUB_REF" ] || [ -z "$TAG" ]; then TAG=$(grep '^version' Cargo.toml | head -1 | sed -E 's/.*"(.*)".*/v\1/'); TAG="v$TAG"; fi
          VERSION=${TAG#v}
          echo "Using TAG=$TAG VERSION=$VERSION"
          # Deterministic archives: sorted names, fixed mtime/owner, gzip -n
          # (no timestamp). Re-running this job for the same tag must produce
          # the same SHA-256, because spa.lock pins exactly one digest per
          # release and a changed digest would break every install that trusts
          # it.
          set -o pipefail
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -cf - -C ui dist | gzip -9n > fog-spa-v${VERSION}.tar.gz
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -cf - -C ui dist | gzip -9n > fog-spa.tar.gz
          ls -lh fog-spa*.tar.gz
      - name: Check the SPA tarball against spa.lock
        run: |
          set -euo pipefail
          VERSION=$(ls fog-spa-v*.tar.gz | head -1 | sed -E 's/^fog-spa-v(.*)\.tar\.gz$/\1/')
          ACTUAL=$(sha256sum "fog-spa-v${VERSION}.tar.gz" | cut -d' ' -f1)
          EXPECTED=$(grep -A3 "^version = \"${VERSION}\"$" spa.lock \
            | sed -n 's/^sha256 = "\([0-9a-f]\{64\}\)"$/\1/p' | head -1 || true)
          echo "fog-spa-v${VERSION}.tar.gz sha256 = ${ACTUAL}"
          if [ -z "$EXPECTED" ]; then
            echo "::warning::spa.lock has no entry for v${VERSION}; 'cargo install --git' at this tag falls back to the newest pinned bundle."
            echo "::warning::After the asset publishes, pin it in spa.lock with:"
            echo "::warning::  version = \"${VERSION}\" / sha256 = \"${ACTUAL}\""
          elif [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::spa.lock pins ${EXPECTED} for v${VERSION}, but this tarball hashes to ${ACTUAL}."
            echo "::error::Publishing it would break builds that trust spa.lock; update spa.lock first."
            exit 1
          else
            echo "spa.lock already pins v${VERSION} with this digest."
          fi
      - name: Publish to crates.io
        uses: katyo/publish-crates@v2
        with:
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          args: --allow-dirty
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            fog-spa-*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
