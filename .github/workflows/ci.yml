name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'benches/**'
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - '.cargo/**'
              - '.github/workflows/**'
            frontend:
              - 'ui/**'
              - '.github/workflows/**'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Lint frontend
        working-directory: ui
        run: pnpm lint
      - name: Check formatting
        working-directory: ui
        run: pnpm format:check
      - name: Build frontend (SPA -> ui/dist)
        working-directory: ui
        run: pnpm build

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.frontend == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The frontend is built below; skip the release-download path in build.rs.
      FOG_SKIP_SPA_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Build frontend (SPA -> ui/dist)
        working-directory: ui
        run: pnpm build
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Check dependencies
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@v2
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: Run clippy
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo test

  ci-required:
    needs: [changes, frontend, rust]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        run: |
          echo "changes=${{ needs.changes.result }}"
          echo "frontend=${{ needs.frontend.result }}"
          echo "rust=${{ needs.rust.result }}"
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "changes job did not succeed"
            exit 1
          fi
          for result in "${{ needs.frontend.result }}" "${{ needs.rust.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) echo "Required job did not succeed: $result"; exit 1 ;;
            esac
          done
