name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'benches/**'
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - '.cargo/**'
              - '.github/workflows/**'
            frontend:
              - 'ui/**'
              - '.github/workflows/**'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('ui/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install dependencies
        working-directory: ui
        run: bun install --frozen-lockfile
      - name: Check, lint, format and build frontend (SPA -> ui/dist)
        working-directory: ui
        run: bun run check
      - name: Upload frontend bundle
        uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: ui/dist
          if-no-files-found: error

  rust:
    needs: [changes, frontend]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.frontend == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The frontend arrives via the ui-dist artifact; never hit the release-download path in build.rs.
      FOG_SKIP_SPA_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Download frontend bundle
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui/dist
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
          cache-on-failure: true
      - name: Check dependencies
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@v2
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: Run clippy
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo test

  ci-required:
    needs: [changes, frontend, rust]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        run: |
          echo "changes=${{ needs.changes.result }}"
          echo "frontend=${{ needs.frontend.result }}"
          echo "rust=${{ needs.rust.result }}"
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "changes job did not succeed"
            exit 1
          fi
          for result in "${{ needs.frontend.result }}" "${{ needs.rust.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) echo "Required job did not succeed: $result"; exit 1 ;;
            esac
          done
