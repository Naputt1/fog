# Pinned prebuilt SPA bundles.
#
# build.rs embeds `ui/dist` when it exists. On `cargo install --git` (no
# `ui/dist`) it downloads the tarball listed here for CARGO_PKG_VERSION and
# verifies it against `sha256` before extracting anything. A mismatch fails the
# build: the bytes that get embedded are exactly the bytes pinned here.
#
# To add an entry for a new release (newest first):
#   curl -fsSL <url> -o /tmp/fog-spa.tgz && shasum -a 256 /tmp/fog-spa.tgz
#
# `lock_version` is the schema of this file, not the crate version.

lock_version = 1

[[spa]]
version = "0.1.3"
url = "https://github.com/Naputt1/fog/releases/download/v0.1.3/fog-spa-v0.1.3.tar.gz"
sha256 = "14bb132df1f670e376cffc6fa8462cd0e5d0bc7301a79ca50021edc0ef4afb1e"

