version = "0.1.2"
url = "https://github.com/Naputt1/fog/releases/download/v0.1.2/fog-spa-v0.1.2.tar.gz"
sha256 = "eb3a7ea3d9578d3c414d94e1527628d9ac8ace62a2529765ca0d5a3e8b91e43f"

